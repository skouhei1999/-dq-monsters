name: Update Amazon prices

on:
  schedule:
    - cron: '3/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dq-amazon-price-update
  cancel-in-progress: false

jobs:
  update-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 9

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: pip install requests beautifulsoup4

      - name: Update next 8 products
        run: python update_prices.py

      - name: Save prices and cursor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update Amazon price batch"
            git push
          fi
